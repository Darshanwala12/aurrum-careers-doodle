<!doctype html><html><head><meta charset='utf-8'><title>AI Career Counsellor Avatar Demo</title><style>html,body{margin:0;height:100%;font-family:system-ui}#app{height:100%;display:grid;place-items:center}#ui{position:fixed;top:12px;left:12px;z-index:2;background:#fff;padding:10px;border-radius:10px}canvas{width:100%;height:100%}</style></head><body><div id='ui'><select id='avatar'><option value='aria_ai_career_counsellor.glb'>Aria</option><option value='elena_ai_career_counsellor.glb'>Elena</option><option value='priya_ai_career_counsellor.glb'>Priya</option><option value='sophie_ai_career_counsellor.glb'>Sophie</option></select><select id='anim'><option>idle</option><option>thinking</option><option>talking</option><option>greeting</option><option>explaining</option><option>pointing</option><option>encouraging</option><option>happy</option><option>surprised</option><option>success</option></select></div><div id='app'></div><script type='module'>import * as THREE from 'https://unpkg.com/three@0.168.0/build/three.module.js';import {GLTFLoader} from 'https://unpkg.com/three@0.168.0/examples/jsm/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f7fb);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,1.15,4.2);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.querySelector('#app').appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(2,4,3);scene.add(d);let root,mixer,gltf;const loader=new GLTFLoader();function load(file){if(root)scene.remove(root);loader.load(file,g=>{gltf=g;root=g.scene;scene.add(root);mixer=new THREE.AnimationMixer(root);play(document.querySelector('#anim').value);});}function play(name){if(!mixer||!gltf)return;mixer.stopAllAction();const c=THREE.AnimationClip.findByName(gltf.animations,name);if(c)mixer.clipAction(c).reset().play();}document.querySelector('#avatar').onchange=e=>load(e.target.value);document.querySelector('#anim').onchange=e=>play(e.target.value);load('aria_ai_career_counsellor.glb');const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);if(mixer)mixer.update(clock.getDelta());r.render(scene,camera)}loop();</script></body></html>
